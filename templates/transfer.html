{% extends "base.html" %}
{% block title %}Transfer — SecureBank{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Transfer money</h1>
  <p>Each transfer is hashed (SHA-256) and digitally signed (RSA-PSS) before commit.</p>
</div>

<form method="post" class="transfer-form">
  <div class="mb-3">
    <label class="form-label" for="receiver_id">Receiver</label>
    <select class="form-select" id="receiver_id" name="receiver_id" required>
      <option value="" disabled selected>Select user</option>
      {% for u in users %}
      <option value="{{ u.id }}">{{ u.username }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-4">
    <label class="form-label" for="amount">Amount (USD)</label>
    <input class="form-control" type="number" step="0.01" min="0.01" id="amount" name="amount" required>
  </div>
  <button class="btn btn-primary" type="submit">Send signed transfer</button>
  <a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">Cancel</a>
</form>
{% endblock %}
